<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tizarr</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <nav id="sidebar">
        <div class="brand">Tizarr</div>
        <button data-nav data-action="go" data-screen="home">
          <span class="icon" data-icon="home"></span><span data-i18n="nav.home"></span>
        </button>
        <button data-nav data-action="go" data-screen="search">
          <span class="icon" data-icon="search"></span><span data-i18n="nav.search"></span>
        </button>
        <button data-nav data-action="go" data-screen="movies">
          <span class="icon" data-icon="movie"></span><span data-i18n="nav.movies"></span>
        </button>
        <button data-nav data-action="go" data-screen="shows">
          <span class="icon" data-icon="show"></span><span data-i18n="nav.shows"></span>
        </button>
        <button data-nav data-action="go" data-screen="library">
          <span class="icon" data-icon="library"></span><span data-i18n="nav.library"></span>
        </button>
        <button data-nav data-action="go" data-screen="downloads">
          <span class="icon" data-icon="downloads"></span><span data-i18n="nav.downloads"></span>
        </button>
        <button data-nav data-action="go" data-screen="settings">
          <span class="icon" data-icon="settings"></span><span data-i18n="nav.settings"></span>
        </button>
      </nav>

      <div id="settings" class="view">
        <h1 data-i18n="settings.title"></h1>
        <section class="settings-group" data-group="app">
          <h2>
            <span class="icon" data-icon="region"></span><span data-i18n="settings.general"></span>
          </h2>
          <div class="field-row">
            <div class="field">
              <div class="label" data-i18n="settings.language"></div>
              <div class="chips" data-field="language"></div>
            </div>
            <div class="field">
              <div class="label" data-i18n="settings.region"></div>
              <div class="chips" data-field="region"></div>
            </div>
          </div>
          <div class="label" data-i18n="settings.tmdbKey"></div>
          <div class="row">
            <input data-nav data-field="tmdbKey" type="text" class="secret" autocomplete="off" />
            <button data-nav data-action="testTmdb">
              <span class="icon" data-icon="test"></span><span data-i18n="settings.test"></span>
            </button>
            <span class="status"></span>
          </div>
          <div class="hint" data-i18n="settings.tmdbHint"></div>
        </section>
        <section class="settings-group" data-group="sonarr">
          <h2>
            <span class="icon" data-icon="show"></span><span data-i18n="settings.sonarr"></span>
          </h2>
          <div class="row">
            <input data-nav data-field="url" type="text" placeholder="http://sonarr.lan" />
            <input
              data-nav
              data-field="apiKey"
              type="text"
              class="secret"
              autocomplete="off"
              data-i18n-placeholder="settings.apiKey"
            />
            <button data-nav data-action="test">
              <span class="icon" data-icon="test"></span><span data-i18n="settings.test"></span>
            </button>
            <span class="status"></span>
          </div>
          <div class="label" data-i18n="settings.qualityProfile"></div>
          <div class="chips" data-field="qualityProfileId"></div>
          <div class="label" data-i18n="settings.rootFolder"></div>
          <div class="chips" data-field="rootFolderPath"></div>
        </section>
        <section class="settings-group" data-group="radarr">
          <h2>
            <span class="icon" data-icon="movie"></span><span data-i18n="settings.radarr"></span>
          </h2>
          <div class="row">
            <input data-nav data-field="url" type="text" placeholder="http://radarr.lan" />
            <input
              data-nav
              data-field="apiKey"
              type="text"
              class="secret"
              autocomplete="off"
              data-i18n-placeholder="settings.apiKey"
            />
            <button data-nav data-action="test">
              <span class="icon" data-icon="test"></span><span data-i18n="settings.test"></span>
            </button>
            <span class="status"></span>
          </div>
          <div class="label" data-i18n="settings.qualityProfile"></div>
          <div class="chips" data-field="qualityProfileId"></div>
          <div class="label" data-i18n="settings.rootFolder"></div>
          <div class="chips" data-field="rootFolderPath"></div>
        </section>
        <div class="row">
          <button data-nav data-action="save">
            <span class="icon" data-icon="save"></span><span data-i18n="settings.save"></span>
          </button>
          <span id="settings-status" class="status"></span>
        </div>
      </div>

      <div id="home" class="view">
        <div id="home-notice" class="notice"></div>
        <div id="home-shelves"></div>
      </div>

      <div id="movies" class="view">
        <div id="movies-notice" class="notice"></div>
        <div id="movies-shelves"></div>
      </div>

      <div id="shows" class="view">
        <div id="shows-notice" class="notice"></div>
        <div id="shows-shelves"></div>
      </div>

      <div id="search" class="view">
        <div class="search-box">
          <span class="icon" data-icon="search"></span>
          <input id="query" data-nav type="text" data-i18n-placeholder="search.placeholder" />
        </div>
        <div id="search-filters" class="tabs" hidden>
          <button class="tab" data-nav data-action="filter" data-filter="all">
            <span class="icon" data-icon="search"></span><span data-i18n="search.all"></span>
          </button>
          <button class="tab" data-nav data-action="filter" data-filter="movie">
            <span class="icon" data-icon="movie"></span><span data-i18n="search.movies"></span>
          </button>
          <button class="tab" data-nav data-action="filter" data-filter="show">
            <span class="icon" data-icon="show"></span><span data-i18n="search.shows"></span>
          </button>
        </div>
        <div id="search-notice" class="notice"></div>
        <div id="search-results" class="grid"></div>
        <div id="search-start">
          <section id="search-recent" hidden>
            <h2 data-i18n="search.recent"></h2>
            <div class="chips"></div>
          </section>
          <section id="search-trending" class="shelf" hidden>
            <h2 data-i18n="shelf.trending"></h2>
            <div class="shelf-track"></div>
          </section>
        </div>
      </div>

      <div id="library" class="view">
        <div class="tabs">
          <button class="tab" data-nav data-action="tab" data-tab="movie">
            <span class="icon" data-icon="movie"></span><span data-i18n="library.movies"></span>
          </button>
          <button class="tab" data-nav data-action="tab" data-tab="show">
            <span class="icon" data-icon="show"></span><span data-i18n="library.shows"></span>
          </button>
        </div>
        <div id="library-notice" class="notice"></div>
        <div id="library-grid" class="grid"></div>
      </div>

      <div id="downloads" class="view">
        <h1 data-i18n="nav.downloads"></h1>
        <div id="downloads-notice" class="notice"></div>
        <div id="downloads-list"></div>
        <h2 class="section-title" data-i18n="downloads.upcoming"></h2>
        <div id="downloads-upcoming"></div>
        <div
          id="downloads-no-upcoming"
          class="notice"
          data-i18n="downloads.noUpcoming"
          hidden
        ></div>
      </div>

      <div id="player" class="view">
        <iframe id="player-frame" tabindex="-1" allow="autoplay; encrypted-media"></iframe>
        <div class="player-hint" data-i18n="player.hint"></div>
      </div>

      <div id="dialog" class="view">
        <div class="dialog-box">
          <h1 id="dialog-title"></h1>
          <p id="dialog-message"></p>
          <div id="dialog-buttons" class="row"></div>
        </div>
      </div>

      <div id="details" class="view">
        <div class="backdrop"><img id="d-backdrop" alt="" /></div>
        <div class="d-hero">
          <img id="d-poster" alt="" />
          <div class="d-info">
            <div id="d-status"></div>
            <h1 id="d-title"></h1>
            <div id="d-facts" class="d-facts"></div>
            <div id="d-ratings" class="d-ratings"></div>
            <p id="d-overview"></p>
            <div id="d-progress" class="d-progress"></div>
            <div id="d-actions" class="row">
              <button id="d-request" data-nav data-action="request">
                <span class="icon" data-icon="request"></span><span class="label"></span>
              </button>
              <button id="d-trailer" data-nav data-action="trailer" hidden>
                <span class="icon" data-icon="play"></span><span data-i18n="details.trailer"></span>
              </button>
              <button id="d-choose" data-nav data-action="choose" hidden>
                <span class="icon" data-icon="show"></span><span data-i18n="seasons.choose"></span>
              </button>
            </div>
            <div id="d-manage" class="row" hidden>
              <button id="d-another" data-nav data-action="tryAnother" hidden>
                <span class="icon" data-icon="refresh"></span
                ><span data-i18n="manage.tryAnother"></span>
              </button>
              <button id="d-delete" class="danger" data-nav data-action="deleteTitle">
                <span class="icon" data-icon="trash"></span><span class="label"></span>
              </button>
              <span id="d-manage-status" class="status"></span>
            </div>
            <div id="d-panel" class="d-panel" hidden>
              <div class="label" data-i18n="seasons.quick"></div>
              <div id="d-quick" class="chips"></div>
              <div id="d-season-rows"></div>
              <div class="row">
                <button id="d-panel-request" data-nav data-action="panelRequest">
                  <span class="icon" data-icon="request"></span><span class="label"></span>
                </button>
                <button data-nav data-action="closePanel">
                  <span data-i18n="seasons.cancel"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <section id="d-similar" class="shelf" hidden>
          <h2 data-i18n="details.similar"></h2>
          <div class="shelf-track"></div>
        </section>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
