<!doctype html>
<!--
  Tizarr trailer player. The TV app runs from local files and cannot send a Referer, which
  YouTube now requires (error 153). The app loads this page instead, and this page embeds
  the trailer from a real https origin. It accepts only an 11-character YouTube id.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Tizarr trailer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      var id = new URLSearchParams(location.search).get('v') || '';
      if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
        var frame = document.createElement('iframe');
        frame.allow = 'autoplay; encrypted-media';
        frame.src =
          'https://www.youtube-nocookie.com/embed/' +
          id +
          '?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&fs=0';
        document.body.appendChild(frame);
      }
    </script>
  </body>
</html>
